[bar.default]
background_opacity = 0.5
center = [ "date", "spacer_2", "clock" ]
end = [
    "weather",
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "battery",
    "headphone_batt",
    "session"
]
margin_edge = 8
scale = 1.350000012665987
start = [ "launcher", "wallpaper", "workspaces", "cpu_usage", "cpu_temp", "memory", "hello" ]


[plugin_settings."me/example"]
greeter_open_near_click = true
greeter_placement = "attached"

[plugin_settings."noctalia/timer"]
panel_placement = "floating"
panel_position = "center"

[plugins]
auto_update = "all"
enabled = [ "me/icue-presets" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/noctalia/plugins/"
    name = "my-plugins"

[shell]
font_family = "Inter"
polkit_agent = true
telemetry_enabled = false
ui_scale = 1.2500000111758709

    [shell.launcher.providers.session]
    global = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"

    [shell.shadow]
    direction = "down_right"

[system.monitor]
gpu_poll_seconds = 0

[theme]
builtin = "Ayu"
community_palette = "Oasis Abyss"
custom_palette = "Ayu"
mode = "dark"
source = "community"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "zathura" ]

[wallpaper]
directory = "/home/browser/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/browser/Pictures/Wallpapers/wallhaven-57d3e7_2560x1440.png"

    [wallpaper.last]
    path = "/home/browser/Pictures/Wallpapers/wallhaven-57d3e7_2560x1440.png"

    [wallpaper.monitors.DP-1]
    path = "/home/browser/Pictures/Wallpapers/wallhaven-57d3e7_2560x1440.png"

    [wallpaper.monitors.DP-5]
    path = "/home/browser/Pictures/Wallpapers/wallhaven-57d3e7_2560x1440.png"

    [[wallpaper.favorite]]
    community_palette = "Oasis Abyss"
    palette_source = "community"
    path = "/home/browser/Pictures/Wallpapers/wallhaven-57d3e7_2560x1440.png"
    theme_mode = "light"

[widget.batt_headphones]
device = "/org/freedesktop/UPower/devices/headset_dev_AC_80_0A_AE_7D_10"
display_mode = "graphic"
type = "battery"

[widget.battery]
device = "/org/freedesktop/UPower/devices/battery_hidpp_battery_0"
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = true

[widget.clock]
anchor = true
color = "on_surface_variant"

[widget.cpu_temp]
gauge_color = "secondary"
stat = "cpu_temp"
type = "sysmon"

[widget.cpu_usage]
type = "sysmon"

[widget.date]
color = "on_surface_variant"

[widget.gpu_temp]
stat = "gpu_temp"
type = "sysmon"

[widget.gpu_usage]
stat = "gpu_usage"
type = "sysmon"

[widget.headphone_batt]
device = "/org/freedesktop/UPower/devices/headset_dev_AC_80_0A_AE_7D_10"
display_mode = "graphic"
type = "battery"

[widget.hello]
type = "me/icue-presets:hello"

[widget.media]
hide_when_no_media = true

[widget.memory]
stat = "ram_used"
type = "sysmon"

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"